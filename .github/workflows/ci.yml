name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 02:00 UTC. At most once a night, to keep load on the public demo low.
    - cron: '0 2 * * *'
  workflow_dispatch: # lets you start a run by hand from the Actions tab

# Cancel an older run on the same branch when a newer commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Playwright tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browsers and their system libraries
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run tests
        run: npx playwright test
      # Keep the report even when tests fail, so failures can be inspected
      - name: Upload report as build artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Prepare report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

  publish:
    name: Publish report to GitHub Pages
    # Only main publishes, so pull requests can't overwrite the live report
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test.result != 'skipped' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
